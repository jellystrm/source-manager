name: "Source Manager"
guid: "b0e976c7-b9e6-4a30-93d9-0a7858c6dd96"
version: "1.0.7.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "jellystrm"
category: "General"
overview: "Request workflow, source resolution, and managed STRM library support for Source Manager clients."
description: >
  Source Manager accepts authenticated Source Manager client requests,
  lets Jellyfin admins approve or reject them, persists request state in a
  plugin-owned SQLite database, emits request updates over SSE, and maps
  approved requests to Jellyfin items by TMDB provider IDs. Admins can
  supply a stream URL when approving a request; the plugin writes a .strm
  file into a configured library directory so Jellyfin picks it up
  automatically.
artifacts:
  - "Jellyfin.Plugin.SourceManager.dll"
  - "Jellyfin.Plugin.SourceManager.deps.json"
  - "Microsoft.Data.Sqlite.dll"
  - "SQLitePCLRaw.core.dll"
  - "SQLitePCLRaw.provider.e_sqlite3.dll"
  - "SQLitePCLRaw.batteries_v2.dll"
  - "runtimes/**"
changelog: |
  ## 1.0.7.0
  - Adds automatic source resolution background service (SourceResolutionService).
    Scans processing requests without a stream URL every 60 seconds and tries
    resolvers in order: KKPhim → OPhim (m3u8 → .strm) → YTS (torrent).
  - Adds KkPhimResolver: searches phimapi.com by title, verifies by TMDB ID,
    returns m3u8 stream URL.
  - Adds OPhimResolver: same API format as KKPhim, searches ophim1.com.
  - Adds YtsResolver: queries yts.mx API, picks best quality torrent, returns
    magnet link.
  - Adds QBittorrentClient: sends magnet links to qBittorrent Web API v2.
  - Adds EnableAutoResolution, QBittorrentUrl/Username/Password config fields.
  - Adds UpdateStreamUrlAsync to IRequestRepository for updating stream URL
    without changing request status.
  - Updates dashboard: new Auto Source Resolution section with enable toggle
    and qBittorrent connection fields.

  ## 1.0.6.0
  - Adds Sonarr-compatible API at /SourceManager/sonarr for TV series requests.
    Jellyseerr can now point to Source Manager as both a Radarr instance (movies)
    and a Sonarr instance (series) — no real Radarr or Sonarr required.
  - Adds SonarrApiKey plugin setting (auto-generated, shown in dashboard).
  - Series are identified by TVDB ID; stored alongside movie requests in the
    same SQLite table with media_type = 'series'.
  - Sonarr endpoints: system/status, qualityProfile, languageProfile, rootfolder,
    tag, series/lookup, series (CRUD), command, episode, episodefile.
  - Updates dashboard Jellyseerr section to show both Radarr and Sonarr
    URLs and API keys with copy buttons and a 5-step setup guide.

  ## 1.0.5.0
  - Adds Jellyseerr integration: Source Manager now exposes a Radarr-compatible
    API at /SourceManager/radarr so Jellyseerr can point to it instead of a real
    Radarr instance. When an admin approves a request in Jellyseerr, it is
    forwarded directly to Source Manager.
  - Adds RadarrApiKey plugin setting (auto-generated, shown in dashboard page).
  - Adds Jellyseerr Integration section in the plugin configuration page with
    copy buttons for the Radarr URL and API key, and a 5-step setup guide.
  - Radarr-compat endpoints: system/status, qualityProfile, rootfolder, tag,
    queue, movie/lookup, movie (CRUD), command.

  ## 1.0.4.0
  - Adds .strm file writing: admins can supply a stream URL when approving a
    request; the plugin writes a .strm file under the configured library path.
  - Adds StrmLibraryPath plugin setting (configurable from the dashboard page).
  - Stores stream_url in the SQLite database; auto-migrates existing databases.
  - Deletes the .strm file automatically when a request is rejected.
  - Fixes Makefile: release pipeline now syncs the .csproj version from the
    VERSION argument, so assembly version always matches the release tag.

  ## 1.0.3.0
  - Enables the Source Manager dashboard page in the Jellyfin Plugins sidebar.

  ## 1.0.2.0
  - Renames the Jellyfin catalog and dashboard display name to Source Manager.

  ## 1.0.1.0
  - Adds a Jellyfin dashboard plugin page so Source Manager appears in the Plugins sidebar.

  ## 1.0.0.0
  - Initial request workflow plugin.
  - Adds authenticated Source Manager request APIs.
  - Adds admin approve/reject/refresh APIs.
  - Adds plugin-owned SQLite persistence.
  - Adds SSE request status updates.
  - Adds READY mapping from Jellyfin library TMDB provider IDs.
