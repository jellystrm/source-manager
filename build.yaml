name: "Source Manager"
guid: "b0e976c7-b9e6-4a30-93d9-0a7858c6dd96"
version: "1.0.4.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "jellystrm"
category: "General"
overview: "Request workflow, source resolution, and managed STRM library support for Source Manager clients."
description: >
  Source Manager accepts authenticated Source Manager client requests,
  lets Jellyfin admins approve or reject them, persists request state in a
  plugin-owned SQLite database, emits request updates over SSE, and maps
  approved requests to Jellyfin items by TMDB provider IDs. Admins can
  supply a stream URL when approving a request; the plugin writes a .strm
  file into a configured library directory so Jellyfin picks it up
  automatically.
artifacts:
  - "Jellyfin.Plugin.SourceManager.dll"
  - "Jellyfin.Plugin.SourceManager.deps.json"
  - "Microsoft.Data.Sqlite.dll"
  - "SQLitePCLRaw.core.dll"
  - "SQLitePCLRaw.provider.e_sqlite3.dll"
  - "SQLitePCLRaw.batteries_v2.dll"
  - "runtimes/**"
changelog: |
  ## 1.0.4.0
  - Adds .strm file writing: admins can supply a stream URL when approving a
    request; the plugin writes a .strm file under the configured library path.
  - Adds StrmLibraryPath plugin setting (configurable from the dashboard page).
  - Stores stream_url in the SQLite database; auto-migrates existing databases.
  - Deletes the .strm file automatically when a request is rejected.
  - Fixes Makefile: release pipeline now syncs the .csproj version from the
    VERSION argument, so assembly version always matches the release tag.

  ## 1.0.3.0
  - Enables the Source Manager dashboard page in the Jellyfin Plugins sidebar.

  ## 1.0.2.0
  - Renames the Jellyfin catalog and dashboard display name to Source Manager.

  ## 1.0.1.0
  - Adds a Jellyfin dashboard plugin page so Source Manager appears in the Plugins sidebar.

  ## 1.0.0.0
  - Initial request workflow plugin.
  - Adds authenticated Source Manager request APIs.
  - Adds admin approve/reject/refresh APIs.
  - Adds plugin-owned SQLite persistence.
  - Adds SSE request status updates.
  - Adds READY mapping from Jellyfin library TMDB provider IDs.
