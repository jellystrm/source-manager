name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version, for example 1.0.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Build plugin zip and update manifest
        run: make release VERSION="${{ inputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.version }}" "dist/jellystrm-${{ inputs.version }}.zip" --generate-notes

      - name: Publish plugin repository manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json is already up to date"
          else
            git commit -m "Update plugin repository manifest for ${{ inputs.version }}"
            git push
          fi
